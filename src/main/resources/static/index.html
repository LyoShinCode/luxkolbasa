<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мир ЛюксКолбасы — конструктор</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='88'>🌭</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        // Тема ставится ДО отрисовки — никакого мигания (FOUC)
        (function () {
            var saved = localStorage.getItem('lk-theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>

<header class="header">
    <button id="themeToggle" class="theme-toggle" type="button" title="Сменить тему" aria-label="Сменить тему">🌙</button>
    <h1 class="title">Мир ЛюксКолбасы</h1>
    <p class="tagline">— artigianale salumeria · конструктор премиальных колбас —</p>
</header>

<main class="layout">

    <!-- Левая часть: 2/3 -->
    <section class="card controls" aria-label="Параметры рецептуры">
        <h2 class="card-title">Рецептура</h2>

        <div class="control" data-param="salt">
            <div class="control-head">
                <label for="salt-range"><span class="icon">🧂</span> Соль</label>
                <input id="salt-num" class="num" type="number" min="0" max="100" step="1" value="50" aria-label="Соль, числовое значение">
            </div>
            <input id="salt-range" type="range" min="0" max="100" step="1" value="50" aria-label="Соль, ползунок">
        </div>

        <div class="control" data-param="fat">
            <div class="control-head">
                <label for="fat-range"><span class="icon">🥓</span> Шпик</label>
                <input id="fat-num" class="num" type="number" min="0" max="100" step="1" value="50" aria-label="Шпик, числовое значение">
            </div>
            <input id="fat-range" type="range" min="0" max="100" step="1" value="50" aria-label="Шпик, ползунок">
        </div>

        <div class="control" data-param="pepper">
            <div class="control-head">
                <label for="pepper-range"><span class="icon">🌶️</span> Перец</label>
                <input id="pepper-num" class="num" type="number" min="0" max="100" step="1" value="50" aria-label="Перец, числовое значение">
            </div>
            <input id="pepper-range" type="range" min="0" max="100" step="1" value="50" aria-label="Перец, ползунок">
        </div>

        <button id="createBtn" class="create-btn" type="button">
            <span class="btn-label">Создать</span>
        </button>
        <p class="hint">или просто нажмите <kbd>Enter</kbd></p>
    </section>

    <!-- Правая часть: 1/3, затемнённая витрина -->
    <section class="showcase" id="showcase" aria-label="Готовая колбаса" aria-live="polite">
        <div class="placeholder" id="placeholder">
            <div class="placeholder-icon">🌭</div>
            <p>Выставьте уровни соли, шпика и перца<br>и нажмите «Создать»</p>
        </div>

        <div class="result" id="result" hidden>
            <div class="art" id="sausageArt"></div>
            <div class="name" id="sausageName"></div>
            <div class="desc" id="sausageDesc"></div>
        </div>

        <div class="error" id="errorBox" hidden>
            <div class="placeholder-icon">😔</div>
            <p id="errorText"></p>
        </div>
    </section>

</main>

<script src="app.js"></script>
</body>
</html>
